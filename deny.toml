# cargo-deny configuration for Tavern.
# Install: cargo install cargo-deny --locked
# Run:    cargo deny check
# See docs/SLIM_STACK.md (Phase 6)

[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "warn"
# Fail on unmaintained only for direct workspace deps.
unmaintained = "workspace"
unsound = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "0BSD",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path deps in private workspace crates are not crates.io wildcards.
allow-wildcard-paths = true
# Direct deps are gated by scripts/check-dependency-allowlist.sh.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
